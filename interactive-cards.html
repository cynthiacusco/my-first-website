<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="author" content="Cynthia Schubert">
		<title>Interactive Cards Project</title>
		<!-- Links to your main site styles -->
		<link rel="stylesheet" href="css/styles.css">
		<style>
			.card-container { 
				display: flex; 
				gap: 16px; 
				flex-wrap: wrap; 
				margin-top: 20px;
			}
			/* Group all three class labels together for their custom card borders */
			.card1, .card2, .card3 {
				border: 2px solid #ccc;
				border-radius: 8px;
				padding: 16px;
				width: 200px;
				background-color: #FFFFFF;
				cursor: pointer;
				transition: all 0.2s ease;
			}
			/* This is the state style that activates when clicked */
			.card1.selected, .card2.selected, .card3.selected {
				border-color: #007bff !important;
				background-color: #e7f1ff !important;
				transform: scale(1.03);
			}
			.card1 h3, .card2 h3, .card3 h3 { margin: 0 0 8px; color: #2F2A26; }
			.card1 p, .card2 p, .card3 p { margin: 0; color: #555; font-size: 14px; }
			#status { margin-top: 24px; font-weight: bold; font-size: 18px; }
		</style>
	</head>
	<body>
		<header>
			<h1 class="section-label"><strong>The Schuberts's</strong></h1>
			<nav id="site-navigation" aria-label="primary">	
				<ul>
					<li><a href="index.html" class="nav-link">Home</a></li>
					<li><a href="about.html" class="nav-link">About</a></li>
					<li><a href="contact-us.html" class="nav-link">Contact</a></li>
					<li><a href="play-list.html" class="nav-link">Play List</a></li>
					<li><a href="payment.html" class="nav-link">Payment</a></li>
					<li><a href="content-practice.html">Open Content Practice Page</a></li>
					<li><a href="interactive-cards.html" class="nav-link" aria-current="page">Interactive Cards Project</a></li>
				</ul>
			</nav>
		</header>

		<main id="main-content">
			<section>
				<h2>Choose Your Interests</h2>
				<div class="card-container" id="card-container"></div>
				<p id="status">No interests selected.</p>
			</section>
		</main>

		<footer>
			<p>Copyright &copy; 2024 Cynthia Schubert</p>
		</footer>	

		<!-- Points cleanly to your js folder -->
		<script src="js/cards.js"></script>
	</body>
</html>
