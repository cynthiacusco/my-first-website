<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Payment</title>
        <rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <header>
            <h1>Payment</h1>
            <form action="/checkout" method="post">
            <fieldset>
            <legend>Shipping Information</legend>
            <label for="shipName">Full Name:</label>
            <input type="text" id="shipName" name="shipName" required>
            <br>
            <label for="shipAddress">Address:</label>
            <input type="text" id="shipAddress" name="shipAddress" required>
            <br>
            <label for="shipCity">City:</label>
            <input type="text" id="shipCity" name="shipCity" required>
            </fieldset>
            <fieldset>
            <legend>Billing Information</legend>
            <label for="billName">Name on Card:</label>
            <input type="text" id="billName" name="billName" required>
            <br>
            <label for="billAddress">Billing Address:</label>
            <input type="text" id="billAddress" name="billAddress" required>
            </fieldset>
            </form>
     </header>
    </body>
</html>
