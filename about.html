<!doctype html>  
<html lang="en">  
<head> 


<meta charset="utf-8" /> 

<title>About - Sample Form</title> 

</head>  
<body> 


<h1>Join Our Newsletter</h1> 

<form id="signup"> 

<label for="name">Name</label> 

<input type="text" id="name" pattern="[A-Za-z\s]+" title="Please enter a valid name" minlength="3" maxlength="50" placeholder="Enter name" required> 
<br>
<label for="email">Email</label>

<input type="email" id="email" placeholder="jane@example.com" title="Please enter a valid email address" required> 
<br>

<label for="phone">Phone</label> 

<input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" title="Phone number (format: 123-456-7890)" placeholder="123-456-7890"> 
<br>

<label>Country</label> 

<select> 

<option value="">Select a country</option> 

<option value="US">United States</option> 

<option value="CA">Canada</option> 

<option value="MX">Mexico</option> 



</select> 
<br>

<div> 

<input type="checkbox" id="promo" > 

<label for="promo">Sign me up for promotional emails</label> 



</div> 
<br>

<button type="submit">Submit</button> 

<button type="reset">Reset</button> 



</form> 

</body> 
</html>
